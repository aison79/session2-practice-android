plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.aison79.session2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aison79.session2'
        minSdk 23
        targetSdk 35
        versionCode((System.getenv('APK_VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('APK_VERSION_NAME') ?: '1.0')
    }
}
